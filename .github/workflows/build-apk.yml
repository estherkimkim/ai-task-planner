name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q "android-project (1).zip" -d appsrc

      - name: Fix Android app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("appsrc/app/src/main/assets/index.html")
          s = html.read_text(encoding="utf-8")

          old = "$('#toggleCompleted').textContent=state.completedExpanded?'접기':`완료된 항목 ${Math.max(0,done.length-4)}개 더 보기`};syncAndroidNotifications(a)"
          new = "$('#toggleCompleted').textContent=state.completedExpanded?'접기':`완료된 항목 ${Math.max(0,done.length-4)}개 더 보기`;syncAndroidNotifications(a)}"
          if old not in s:
              raise SystemExit("render 수정 대상 코드를 찾지 못했습니다.")
          s = s.replace(old, new)

          s = s.replace(
              '<div id="geminiSettingsBody" style="display:none;margin-top:12px">',
              '<div id="geminiSettingsBody" style="display:block;margin-top:12px">'
          )

          main = Path("appsrc/app/src/main/java/com/aitaskplanner/app/MainActivity.java")
          m = main.read_text(encoding="utf-8")
          needle = "settings.setAllowFileAccess(true);"
          if "setAllowUniversalAccessFromFileURLs(true)" not in m:
              m = m.replace(
                  needle,
                  needle + "\n        settings.setAllowFileAccessFromFileURLs(true);\n        settings.setAllowUniversalAccessFromFileURLs(true);"
              )
          main.write_text(m, encoding="utf-8")

          gradle = Path("appsrc/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")
          g = g.replace("versionCode 1", "versionCode 2")
          g = g.replace('versionName "1.0"', 'versionName "2.0"')
          gradle.write_text(g, encoding="utf-8")
          PY

      - name: Keep debug signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ai-task-planner-debug-key-v2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: appsrc
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Task-Planner-v2-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
