name: Build Android APK v4

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project v4
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q "android-project-v4.zip" -d appsrc

      - name: Verify v4 source
        run: |
          grep -q 'versionCode 4' appsrc/app/build.gradle
          grep -q 'public String geminiGenerate' appsrc/app/src/main/java/com/aitaskplanner/app/MainActivity.java
          grep -q '빌드 Android v4 · Gemini 네이티브 연결판' appsrc/app/src/main/assets/index.html

      - name: Keep signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ai-task-planner-debug-key-v2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: appsrc
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Task-Planner-v4-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
