
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q "android-project (1).zip" -d appsrc

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: appsrc
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: test -f appsrc/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Task-Planner-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
