name: Build Android APK v3

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -q "android-project (1).zip" -d appsrc

      - name: Fix app source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("appsrc/app/src/main/assets/index.html")
          s = html.read_text(encoding="utf-8")

          bad = "$('#toggleCompleted').textContent=state.completedExpanded?'접기':`완료된 항목 ${Math.max(0,done.length-4)}개 더 보기`};syncAndroidNotifications(a)"
          good = "$('#toggleCompleted').textContent=state.completedExpanded?'접기':`완료된 항목 ${Math.max(0,done.length-4)}개 더 보기`;syncAndroidNotifications(a)}"

          if bad in s:
              s = s.replace(bad, good)
          elif good not in s:
              raise SystemExit("render 수정 지점을 찾지 못했습니다.")

          s = s.replace(
              '<button class="btn ghost" id="toggleGeminiSettings" type="button">설정</button>',
              '<button class="btn ghost" id="toggleGeminiSettings" type="button" style="display:none">설정</button>'
          )

          s = s.replace(
              '<div id="geminiSettingsBody" style="display:none;margin-top:12px">',
              '<div id="geminiSettingsBody" style="display:block;margin-top:12px">'
          )

          s = s.replace(
              '빌드 Android v1 · 지속 알림 통합판',
              '빌드 Android v3 · 설정 오류 수정 완료'
          )

          html.write_text(s, encoding="utf-8")

          main = Path("appsrc/app/src/main/java/com/aitaskplanner/app/MainActivity.java")
          m = main.read_text(encoding="utf-8")

          needle = "settings.setAllowFileAccess(true);"
          extra = "\n        settings.setAllowFileAccessFromFileURLs(true);\n        settings.setAllowUniversalAccessFromFileURLs(true);"

          if "setAllowUniversalAccessFromFileURLs(true)" not in m:
              if needle not in m:
                  raise SystemExit("WebView 설정 지점을 찾지 못했습니다.")
              m = m.replace(needle, needle + extra)

          main.write_text(m, encoding="utf-8")

          gradle = Path("appsrc/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")
          g = re.sub(r'versionCode\s+\d+', 'versionCode 3', g)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "3.0"', g)
          gradle.write_text(g, encoding="utf-8")
          PY

      - name: Verify fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          s = Path("appsrc/app/src/main/assets/index.html").read_text(encoding="utf-8")

          assert '빌드 Android v3 · 설정 오류 수정 완료' in s
          assert 'id="geminiSettingsBody" style="display:block' in s
          assert 'syncAndroidNotifications(a)}' in s
          assert "};syncAndroidNotifications(a)" not in s

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          Path("/tmp/app.js").write_text("\n".join(scripts), encoding="utf-8")
          PY

          node --check /tmp/app.js

      - name: Keep signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ai-task-planner-debug-key-v2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: appsrc
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Task-Planner-v3-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
